<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Melisa ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

.container {
  text-align: center;
  background: rgba(0,0,0,0.3);
  padding: 30px;
  border-radius: 20px;
  z-index: 10;
}

.glow {
  font-size: 2.5em;
  animation: glow 1.5s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px white; }
  to { text-shadow: 0 0 30px pink, 0 0 40px red; }
}

button {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  margin: 10px;
  cursor: pointer;
}

#yes {
  background: #ff4d6d;
}

#no {
  background: gray;
  position: relative;
}

.heart {
  position: absolute;
  font-size: 20px;
  animation: float 5s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); opacity: 1;}
  to { transform: translateY(-10vh); opacity: 0;}
}

#photo {
  display: none;
  margin-top: 20px;
}

#photo img {
  width: 250px;
  border-radius: 20px;
  box-shadow: 0 0 20px white;
}

#finalText {
  font-size: 30px;
  margin-top: 15px;
  display: none;
  animation: glow 1s infinite alternate;
}

.firework {
  position: absolute;
  font-size: 30px;
  animation: explode 1s ease-out infinite;
}

@keyframes explode {
  0% { transform: scale(0);}
  50% { transform: scale(2);}
  100% { transform: scale(0);}
}

</style>
</head>

<body>

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<div class="container">

<h1 class="glow">Melisa ❤️</h1>

<p>
You make my world brighter ✨<br>
You make my heart happier 😊<br><br>
Melisa, will you be my Valentine?
</p>

<button id="yes" onclick="yesClicked()">YES ❤️</button>
<button id="no" onmouseover="moveNo()">No 😢</button>

<div id="photo">
<img src="photo.jpg">
</div>

<div id="finalText">
Melisa ❤️ Arjun<br>
Forever begins now 💍
</div>

</div>

<script>

document.body.addEventListener("click", function(){
document.getElementById("music").play();
},{once:true});

function yesClicked(){

document.getElementById("photo").style.display="block";
document.getElementById("finalText").style.display="block";

createHearts(30);
createFireworks();

}

function moveNo(){
let btn=document.getElementById("no");
btn.style.position="absolute";
btn.style.left=Math.random()*window.innerWidth+"px";
btn.style.top=Math.random()*window.innerHeight+"px";
}

function createHearts(num){
for(let i=0;i<num;i++){
let heart=document.createElement("div");
heart.innerHTML="❤️";
heart.className="heart";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
}
}

function createFireworks(){
setInterval(()=>{
let fire=document.createElement("div");
fire.innerHTML="🎆";
fire.className="firework";
fire.style.left=Math.random()*100+"vw";
fire.style.top=Math.random()*100+"vh";
document.body.appendChild(fire);
},300);
}

</script>

</body>
</html>
